[project]
name = "003-presto-finetune"
version = "0.1.0"
description = "Presto encoder fine-tune for viticulture crop suitability (±1 accuracy)"
authors = [
    { name = "hkee7" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "polars>=1.38.1",
    "tqdm>=4.64.1",   # floor matches Presto's pinned version
    "einops>=0.6.0",   # direct dep that Presto uses (we install presto --no-deps)
    "h5py>=3.6.0",
    # Presto installed from GitHub with no transitive deps (avoids earthengine/openmapflow)
    "presto @ git+https://github.com/nasaharvest/presto.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# uv.sources: resolve presto from GitHub instead of PyPI.
[tool.uv.sources]
presto = { git = "https://github.com/nasaharvest/presto.git" }

# uv.override-dependencies: break Presto's exact tqdm==4.64.1 pin.
# Presto's setup.py pins tqdm==4.64.1; here we loosen it so uv can pick
# any compatible tqdm >= 4.64.1 and satisfy both Presto and our own floor.
[tool.uv]
override-dependencies = [
    "tqdm>=4.64.1",
]
