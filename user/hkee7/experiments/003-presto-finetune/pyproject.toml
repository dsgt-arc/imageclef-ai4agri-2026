[project]
name = "003-presto-finetune"
version = "0.1.0"
description = "Presto encoder fine-tune for viticulture crop suitability (±1 accuracy)"
authors = [
    { name = "hkee7" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "polars>=1.38.1",
    "tqdm>=4.65.0",
    "einops>=0.6.0",   # direct dep that Presto uses (we install presto --no-deps)
    "h5py>=3.6.0",
    # Presto installed from GitHub with no transitive deps (avoids earthengine/openmapflow)
    "presto @ git+https://github.com/nasaharvest/presto.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# Tell uv to install the presto git source without pulling its declared
# install_requires (which includes earthengine-api, openmapflow, cropharvest).
# We manually list the two deps we actually need (einops, h5py) above.
[tool.uv.sources]
presto = { git = "https://github.com/nasaharvest/presto.git" }
