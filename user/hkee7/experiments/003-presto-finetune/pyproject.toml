[project]
name = "003-presto-finetune"
version = "0.1.0"
description = "Presto encoder fine-tune for viticulture crop suitability (±1 accuracy)"
authors = [
    { name = "hkee7" },
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "polars>=1.38.1",
    "tqdm>=4.65.0",
    "einops>=0.6.0",   # only runtime dep of single_file_presto.py
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# No [tool.uv.sources] needed — presto is vendored as single_file_presto.py
# and imported directly. No pip package required.
