[project]
name = "005-rf-cuml-baseline"
version = "0.1.0"
description = "Pixel-wise RandomForest baseline for AI4Agri (cuML-preferred)"
authors = [
    { name = "hkee7" },
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
gpu = [
    "cuml-cu12>=25.2.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
